name: KungFuSID Build

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set VERSION from git describe
        run: |
          git fetch --tags
          VERSION=$(git describe --tags --always --dirty=-dev)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Using build version: $VERSION"

      - name: Install build toolchains
        run: |
          sudo apt update
          sudo apt install -y gcc-arm-none-eabi cc65 make

      - name: Build KungFuSID Firmware
        run: |
          cd firmware
          make version=$VERSION

      - name: Verify firmware build success
        run: |
          if ! ls firmware/build/*.bin 1>/dev/null 2>&1; then
            echo "Build failed: No .bin file found in the firmware/build/ folder!"
            exit 1
          fi
          echo "Firmware build successful!"

      - name: Build updater from fresh firmware binary
        run: |
          rm -f updater/*.bin
          cp firmware/build/*.bin updater/
          python3 updater/generate_blob.py updater/*.bin
          cd updater
          make

      - name: Verify updater build output
        run: |
          if [ ! -f updater/updater.prg ]; then
            echo "Build failed: updater/updater.prg not found."
            exit 1
          fi

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp -r firmware/build artifacts/firmware-build
          cp updater/updater.prg artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kungfusid-build
          path: artifacts/*
